name: Build and publish
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 11 * * *"   # 18:00 Bangkok, often later
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests
      - run: python src/build_data.py --sample
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.13", cache: pip}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -r requirements.txt
      - run: python src/build_data.py
        env:
          BOT_TOKEN_EXCHANGE: ${{ secrets.BOT_API_TOKEN_3 }}   # app subscribed to Exchange Rates
          BOT_TOKEN_POLICY: ${{ secrets.BOT_API_TOKEN_2 }}     # app subscribed to Policy Rate
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with: {path: web/dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
