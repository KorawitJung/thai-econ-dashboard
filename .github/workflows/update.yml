name: Build data
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 11 * * *"   # 18:00 Bangkok
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests
      - run: python src/build_data.py --sample
  data:
    # Real data needs the BOT_API_TOKEN secret, which pull requests from forks never get.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - run: python src/build_data.py
        env:
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
